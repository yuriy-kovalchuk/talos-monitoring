{{- if .Values.serviceMonitor.enabled }}
# Requires the monitoring.coreos.com/v1 CRD (Prometheus Operator).
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "talos-monitoring.fullname" . }}
  namespace: {{ .Values.serviceMonitor.namespace | default .Release.Namespace }}
  labels:
    {{- include "talos-monitoring.labels" . | nindent 4 }}
    {{- with .Values.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  selector:
    matchLabels:
      {{- include "talos-monitoring.selectorLabels" . | nindent 6 }}
  endpoints:
    # scrapeTimeout must stay above the 10 s per-node collection budget.
    #
    # honorLabels defaults to true and should stay there. The operator's default
    # relabeling puts `service` and `namespace` on every scraped series, and two
    # of this exporter's own families already use those names: `service` on
    # talos_service_* (etcd, kubelet, ...) and `namespace` on talos_pv_info.
    # Without honorLabels Prometheus resolves the collision by renaming OURS to
    # exported_service / exported_namespace, and every `by (service)` query then
    # groups by the Kubernetes Service name — collapsing a node's twelve Talos
    # services into one row. The bundled dashboards assume the labels arrive
    # intact.
    - port: http
      interval: {{ .Values.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.serviceMonitor.scrapeTimeout }}
      honorLabels: {{ .Values.serviceMonitor.honorLabels }}
{{- end }}
