apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "talos-monitoring.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "talos-monitoring.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "talos-monitoring.clusterRoleName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "talos-monitoring.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
