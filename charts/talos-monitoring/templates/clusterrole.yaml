{{- if .Values.rbac.create }}
# Node discovery and the PersistentVolume informer both read cluster-scoped
# resources; nothing else is touched.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "talos-monitoring.clusterRoleName" . }}
  labels:
    {{- include "talos-monitoring.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["nodes", "persistentvolumes"]
    verbs: ["get", "list", "watch"]
{{- end }}
