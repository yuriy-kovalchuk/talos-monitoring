# Talos in-cluster authentication ("built-in apps"). The talos-sa-controller
# on the nodes watches this CR and maintains a Kubernetes Secret of the same
# name in this namespace (key `config`): a full talosconfig with the cluster
# CA and a client certificate, 6 h TTL, auto-renewed. The Deployment mounts
# that Secret and sets TALOSCONFIG; the client pool rebuilds per-node clients
# whenever the file changes.
#
# Requires machine.features/kubernetesTalosAPIAccess on every node, with
# allowedRoles covering `roles` and allowedKubernetesNamespaces covering the
# release namespace (see README > Prerequisites).
apiVersion: talos.dev/v1alpha1
kind: ServiceAccount
metadata:
  name: {{ .Values.talos.serviceAccountName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "talos-monitoring.labels" . | nindent 4 }}
spec:
  roles:
    {{- range .Values.talos.roles }}
    - {{ . | quote }}
    {{- end }}
