version: "2"
run:
  timeout: 5m
linters:
  enable:
    # defaults (errcheck, govet, staticcheck, ineffassign, unused) stay on;
    # staticcheck SA1019 flags deprecated API usage
    - gosec
    - misspell
    # modernize: builtin forms over hand-written ones (max, WaitGroup.Go,
    # maps.Copy, range over int, strings.SplitSeq)
    - modernize
