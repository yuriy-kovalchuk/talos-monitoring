name: CD

on:
  push:
    tags: ["v*"]

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: true

env:
  # Artifact registry: GHCR serves both the docker image and the helm chart
  # (pushed as an OCI artifact), so one login covers both. Auth uses the
  # workflow's own GITHUB_TOKEN — no repo secrets to configure. Packages
  # publish as private by default on first push; make them public under the
  # repo's Packages settings once you're ready for others to pull.
  REGISTRY: ghcr.io

jobs:
  # The same checks as CI: a tag pushed on a commit that failed them must not publish.
  checks:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      packages: write # granted because ci.yml's :main publish job declares it; it is skipped on tags

  publish:
    name: Publish image + helm chart
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # tags are needed for version stamping

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute version and tags
        id: version
        run: |
          image="${REGISTRY}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          {
            echo "IMAGE=${image}"
            echo "VERSION=${GITHUB_REF_NAME}"
            echo "COMMIT=$(git rev-parse --short HEAD)"
            echo "BUILDDATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo 'TAGS<<EOF'
            echo "${image}:latest"
            echo "${image}:${GITHUB_REF_NAME}"
            echo "${image}:${GITHUB_SHA}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push image (linux/amd64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            VERSION=${{ steps.version.outputs.VERSION }}
            COMMIT=${{ steps.version.outputs.COMMIT }}
            BUILDDATE=${{ steps.version.outputs.BUILDDATE }}
          tags: ${{ steps.version.outputs.TAGS }}

      # The chart is a release artifact: chart versions must be unique semver (there is
      # no "latest"), so the chart publishes only on tag pushes, and the tag is
      # the version. The stamp rewrites a working copy of Chart.yaml (version +
      # appVersion); the templates pin the image tag to appVersion
      # (templates/_helpers.tpl), so appVersion keeps the tag's v prefix and
      # references the :${GITHUB_REF_NAME} image the same run pushed.
      - name: Install helm
        run: |
          curl -fsSL "https://get.helm.sh/helm-v4.3.1-linux-amd64.tar.gz" | tar xz
          sudo mv linux-amd64/helm /usr/local/bin/helm
          helm version --short

      - name: Stamp chart version from tag
        run: |
          ver="${GITHUB_REF_NAME#v}"
          if ! [[ "$ver" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::tag $GITHUB_REF_NAME is not semver (expected e.g. v0.2.0)"
            exit 1
          fi
          sed -i "s/^version:.*/version: ${ver}/" charts/talos-monitoring/Chart.yaml
          sed -i "s/^appVersion:.*/appVersion: \"${GITHUB_REF_NAME}\"/" charts/talos-monitoring/Chart.yaml
          grep -E '^(version|appVersion):' charts/talos-monitoring/Chart.yaml

      - name: Helm lint (stamped chart)
        run: make helm-lint

      - name: Package helm chart
        run: |
          helm package charts/talos-monitoring -d dist
          ls -la dist/

      - name: Publish helm chart (OCI artifact)
        # helm push authenticates through the docker config the login step
        # wrote, so no separate credentials are needed here.
        run: |
          version=$(awk '/^version:/{print $2}' charts/talos-monitoring/Chart.yaml)
          owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          helm push "dist/talos-monitoring-${version}.tgz" "oci://${REGISTRY}/${owner}/charts"
          echo "Pushed talos-monitoring-${version}.tgz"

      # A tag push builds and publishes artifacts but never touches the
      # Releases API on its own — this is the step that actually turns the
      # tag into a GitHub Release, with the packaged chart attached so it's
      # downloadable without an OCI-capable Helm.
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(awk '/^version:/{print $2}' charts/talos-monitoring/Chart.yaml)
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            "dist/talos-monitoring-${version}.tgz"
