name: CI

on:
  push:
    branches: [main]
  pull_request:
  # cd.yml calls this before releasing, so a tag on a red commit never ships.
  workflow_call:

# Read-only by default; the publish job asks for packages:write itself.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# CI runs checks on every push/PR. On a green push to main it additionally
# publishes the :main image (job below); releases — tagged image + helm chart
# — live in cd.yml on tag pushes, so :latest always means newest release.

env:
  # Target of the publish job (main pushes only). GHCR auth uses the
  # workflow's own GITHUB_TOKEN — no repo secrets to configure.
  REGISTRY: ghcr.io

jobs:
  checks:
    name: Code checks + helm lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # tags are needed for git describe in `make build`

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Pinned to a patch, not "1.27": setup-go runs with GOTOOLCHAIN=local, so the
          # toolchain installed here is the standard library govulncheck judges, and a
          # floating minor is just whatever the runner image happens to carry ("1.26"
          # resolved to go1.26.8, which predates the net/http, net/textproto, crypto/tls
          # and html/template fixes go1.26.9 carries). Keep this equal to the go.mod go
          # directive and the Dockerfile base image, and keep golangci-lint below built
          # with at least this Go — it refuses modules newer than its own build.
          go-version: "1.27.3"
          cache: true

      - name: Install golangci-lint
        # golangci-lint refuses to load a module whose Go version is newer than the Go
        # it was built with: v2.11.4 (go1.26.1) rejects a go1.27 module outright. v2.14.0
        # is built with go1.27.0, v2.15.0 with go1.27.2 (a newer patch is accepted).
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/v2.15.0/install.sh \
            | sh -s -- -b "$(go env GOPATH)/bin" v2.15.0
          golangci-lint version

      - name: Format check
        run: |
          unformatted=$(gofmt -s -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt -s needed for: $unformatted"
            exit 1
          fi

      - name: Vet, build, test, lint
        run: make vet build test lint

      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: Install helm
        run: |
          curl -fsSL "https://get.helm.sh/helm-v4.3.1-linux-amd64.tar.gz" | tar xz
          sudo mv linux-amd64/helm /usr/local/bin/helm
          helm version --short

      - name: Helm lint
        run: make helm-lint

      - name: Helm template render (default values)
        run: make helm-template

  publish:
    name: Publish :main image
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # tags are needed for git describe (VERSION)

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute version and tags
        id: version
        run: |
          image="${REGISTRY}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          {
            echo "VERSION=$(git describe --tags --match 'v[0-9]*' 2>/dev/null || echo main)"
            echo "COMMIT=$(git rev-parse --short HEAD)"
            echo "BUILDDATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo 'TAGS<<EOF'
            echo "${image}:main"
            echo "${image}:main-${GITHUB_SHA}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push image (linux/amd64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            VERSION=${{ steps.version.outputs.VERSION }}
            COMMIT=${{ steps.version.outputs.COMMIT }}
            BUILDDATE=${{ steps.version.outputs.BUILDDATE }}
          tags: ${{ steps.version.outputs.TAGS }}
